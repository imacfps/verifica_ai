services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: verifica
      POSTGRES_PASSWORD: verifica
      POSTGRES_DB: verifica_ai
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verifica -d verifica_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://verifica:verifica@db:5432/verifica_ai
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/v1
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  db_data:
