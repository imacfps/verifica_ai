[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]  # asserts são esperados em testes

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]
# Depends()/File() em default de argumento é o padrão idiomático do FastAPI
# para injeção de dependência — não é o problema de mutable-default que B008
# normalmente detecta.
"app/api/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
